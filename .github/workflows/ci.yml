# The same gate the pre-commit hook runs, somewhere --no-verify cannot reach it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: the action reads packageManager from package.json,
      # so CI and a laptop cannot drift onto different lockfile formats.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # PageProps, LayoutProps and the image module declarations are generated, and both
      # .next/ and next-env.d.ts are ignored, so a fresh checkout has neither. Without
      # this, lint and typecheck see them as error types and fail on CI only.
      - run: pnpm run typegen

      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run check:locales
      - run: pnpm run test
      - run: pnpm run build
